name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: flake8 (error-class checks)
        run: |
          pip install flake8 coverage
          flake8 --select=F,E9 cisetup tests bin/ci-setup bin/check-docs bin/runner-cleanup
      - name: Unit tests
        run: |
          coverage run --source=cisetup -m unittest discover -s tests -v
          coverage xml
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
      - name: Documentation links
        run: python3 bin/check-docs
      - name: zsh syntax check
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy zsh
          zsh -n setup host/ssh-askpass
          bash -n host/bootstrap-guest.sh
          bash -n hooks/job-started.sh hooks/job-completed.sh
  restore-helper:
    name: Restore Image Helper
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and verify the Apple metadata helper
        run: |
          restore_helper="$RUNNER_TEMP/restore-image"
          xcrun swiftc host/restore-image.swift -o "$restore_helper"
          codesign --sign - --entitlements host/restore-image.entitlements "$restore_helper"
          codesign --verify --strict "$restore_helper"
      - name: Compile and verify the background launcher
        run: |
          runner_host="$RUNNER_TEMP/runner-host"
          xcrun swiftc host/runner-host.swift -o "$runner_host"
          codesign --sign - "$runner_host"
          codesign --verify --strict "$runner_host"
