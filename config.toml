# Shared configuration for every SchmiedmayerLab runner Mac. This file is
# committed — it must never contain secrets. The GitHub PAT lives in each
# machine's login Keychain instead (./setup.zsh store-pat).

[github]
scope = "org"               # runners are registered org-wide
owner = "SchmiedmayerLab"

[runner]
# name = "my-mac-mini"      # default: this machine's hostname
labels = []                 # extra labels; self-hosted / macOS / ARM64 (X64 on
                            # Intel) are added automatically
dir = "~/actions-runner"    # where the runner software lives
work_dir = "_work"          # job workspaces, relative to dir
# group = "Default"         # org runner group
cleanup_hooks = true        # reset simulators before each job, wipe
                            # workspaces/caches after (hooks/*.sh)

[xcode]
manage = true               # install/maintain Xcode releases via `xcodes`
install_beta = true         # also keep the newest beta/RC (when newer than stable)
platforms = ["all"]         # per-Xcode simulator/SDK downloads: ["all"], a list
                            # like ["iOS", "watchOS"], or [] to skip
sudoless_select = true      # sudoers rule for passwordless `xcode-select -s` and
                            # `xcodebuild -runFirstLaunch` (installed on the first
                            # interactive run; also used by unattended converges)

[brew]
extra_formulae = []         # installed in addition to the built-in tool list
extra_casks = []            # note: many casks need sudo to install; unattended
                            # (boot-time) runs therefore skip cask installs/upgrades
autoupdate = true           # homebrew/autoupdate LaunchAgent: daily unattended
                            # `brew update` + `brew upgrade`

[boot]
install_agent = true        # re-run this setup at every login/boot (LaunchAgent)
# label = "com.selfhosted-runner.setup"

[power]
manage = true               # pmset never-sleep settings (sudo; interactive runs only)
