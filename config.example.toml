# Copy to config.toml and adjust. config.toml carries no secrets and is meant
# to be committed to git — one shared config can serve a whole runner fleet
# (runner names default to each machine's hostname).

[github]
# "repo": the runner belongs to a single repository; "org": to the whole org.
scope = "repo"
owner = "my-org"
repo  = "my-repo"           # only used when scope = "repo"

[runner]
# name = "my-mac-mini"      # default: this machine's hostname
labels = []                 # extra labels; self-hosted / macOS / ARM64 (X64 on
                            # Intel) are added automatically
dir = "~/actions-runner"    # where the runner software lives
work_dir = "_work"          # job workspaces, relative to dir
# group = "Default"         # org runner group (scope = "org" only)

[xcode]
manage = true               # install/maintain Xcode releases via `xcodes`
install_beta = true         # also keep the newest beta/RC (when newer than stable)
platforms = ["all"]         # per-Xcode simulator/SDK downloads: ["all"], a list
                            # like ["iOS", "watchOS"], or [] to skip

[brew]
extra_formulae = []         # installed in addition to the built-in tool list
extra_casks = []            # note: many casks need sudo to install; unattended
                            # (boot-time) runs therefore skip cask installs/upgrades

[boot]
install_agent = true        # re-run this setup at every login/boot (LaunchAgent)
# label = "com.selfhosted-runner.setup"

[power]
manage = false              # true: pmset never-sleep settings (sudo; interactive runs only)
